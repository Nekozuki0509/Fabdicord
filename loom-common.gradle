apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

base.archivesName = "fabdicord-${archive_version}"

loom {
    splitEnvironmentSourceSets()
    mods {
        "fabdicord" { sourceSet sourceSets.main }
    }
}

fabricApi {
    configureDataGeneration { client = true }
}

sourceSets {
    main {
        resources {
            srcDirs += rootProject.file('templates')
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft          "com.mojang:minecraft:${minecraft_version}"
    mappings           "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation  "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation  "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "maven.modrinth:carpet:${project.carpet_version}"

    implementation include(project(':common'))
}

def resVersion          = project.version
def resMcVersion        = project.property("archive_version")
def resLoaderVersion    = project.property("loader_version")

processResources {
    inputs.property "version",           resVersion
    inputs.property "archive_version", resMcVersion
    inputs.property "loader_version",    resLoaderVersion

    filesMatching("fabric.mod.json") {
        expand(
                version:           resVersion,
                archive_version: resMcVersion,
                loader_version:    resLoaderVersion
        )
    }
    filteringCharset "UTF-8"
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

tasks.named('remapJar') {
    destinationDirectory = rootProject.file('dist')
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}