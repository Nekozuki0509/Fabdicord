plugins {
    id 'java-library'
}

dependencies {
    api("net.dv8tion:JDA:6.4.0") {
        exclude module: "opus-java"
    }
    api 'com.squareup.okhttp3:okhttp:5.3.2'
    api 'org.jetbrains.kotlin:kotlin-stdlib:2.4.0-Beta1'
    api 'com.squareup.okio:okio-jvm:3.17.0'
    api 'com.neovisionaries:nv-websocket-client:2.14'
    api 'net.sf.trove4j:core:3.1.0'
    api 'com.fasterxml.jackson.core:jackson-core:2.21.2'
    api 'com.fasterxml.jackson.core:jackson-databind:2.21.2'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.21'
    api 'org.apache.commons:commons-collections4:4.5.0'
    //api 'jakarta.websocket:jakarta.websocket-api:2.1.1'
    api 'org.glassfish.tyrus:tyrus-server:2.1.5'
    api 'org.glassfish.tyrus:tyrus-container-grizzly-server:2.1.5'
    //api 'javax.websocket:javax.websocket-api:1.1'

    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
}

jar {
    from configurations.runtimeClasspath.collect {
        it.isDirectory() ? it : zipTree(it)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}